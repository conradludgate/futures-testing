[package]
name = "futures-testing"
version = "0.1.0"
edition = "2021"

[features]
tracing = ["dep:tracing"]

[dependencies]
arbitrary = "1"
arbtest = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
pin-project-lite = "0.2"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync"] }
diatomic-waker = "0.2"
scopeguard = "1"
futures = "0.3"
tracing-subscriber = "0.3"
