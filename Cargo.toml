[package]
name = "futures-testing"
version = "0.1.1"
edition = "2024"
rust-version = "1.86"
authors = ["Conrad Ludgate <conradludgate@gmail.com>"]
license = "Apache-2.0"
description = "Property-based testing framework for futures, fuzzing poll ordering to catch waker bugs"
keywords = ["futures", "testing", "async", "waker", "fuzzing"]
categories = ["development-tools::testing", "asynchronous"]
homepage = "https://github.com/conradludgate/futures-testing"
repository = "https://github.com/conradludgate/futures-testing"

[features]
tracing = ["dep:tracing"]

[dependencies]
arbitrary = "1"
hegeltest = "0.28.4"
futures-util = { version = "0.3", features = ["sink"] }
pin-project-lite = "0.2"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync"] }
diatomic-waker = "0.2"
scopeguard = "1"
futures = "0.3"
tracing-subscriber = "0.3"

[lints.clippy]
pedantic = "deny"
